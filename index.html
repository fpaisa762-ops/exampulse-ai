<!DOCTYPE html>
<html>
<head>
  <title>ExamPulse AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial;background:#070707;color:white;text-align:center;padding:20px}
    textarea,input,button{width:95%;max-width:700px;padding:12px;margin:8px;border-radius:10px;border:0}
    textarea{height:160px}
    button{background:#00ff88;font-weight:bold;cursor:pointer}
    .box{background:#151515;padding:15px;border-radius:15px;margin:15px auto;max-width:800px;text-align:left}
    .q{border-bottom:1px solid #333;padding:12px}
  </style>
</head>
<body>

<h1>ExamPulse AI 🚀</h1>
<p>YouTube Lecture / Notes se MCQ + PYQ Style Questions</p>

<input id="yt" placeholder="YouTube lecture link paste karo">
<textarea id="notes" placeholder="Lecture ka transcript/notes/topic paste karo. Example: South America world mapping..."></textarea>

<select id="count">
  <option value="5">5 Questions</option>
  <option value="10">10 Questions</option>
  <option value="20">20 Questions</option>
</select>

<button onclick="generateMCQ()">Generate MCQ</button>

<div id="output" class="box"></div>

<script>
const API_KEY = "AQ.Ab8RN6Lqjo08qk0BE9fZDOvwXSGPNPLSUP_oIZp2u48Of5AWjw";

async function generateMCQ() {
  const yt = document.getElementById("yt").value;
  const notes = document.getElementById("notes").value;
  const count = document.getElementById("count").value;
  const output = document.getElementById("output");

  if (!notes.trim()) {
    output.innerHTML = "Please lecture notes/transcript/topic paste karo.";
    return;
  }

  output.innerHTML = "Generating questions...";

  const prompt = `
You are an exam expert.
Make ${count} MCQ questions from this lecture content.

YouTube link: ${yt}
Lecture content:
${notes}

Rules:
- Make questions exam-oriented
- Include PYQ-style questions
- Give 4 options A, B, C, D
- Mark correct answer
- Give short explanation
- Use Hindi + English mixed language
- Format clearly
`;

  try {
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY,
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      }
    );

    const data = await res.json();

    if (data.error) {
      output.innerHTML = "API Error: " + data.error.message;
      return;
    }

    const text = data.candidates[0].content.parts[0].text;
    output.innerHTML = text.replace(/\n/g, "<br>");

  } catch (err) {
    output.innerHTML = "Error: " + err.message;
  }
}
</script>

</body>
</html>
